<footer class="site-footer">
  <div>
    <strong>{{ site.title }}</strong>
    <span>· Projects, Research, Notes & Play</span>
  </div>
  <div class="footer-links">
    {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}">GitHub</a>{% endif %}
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
</footer>
<script src="{{ '/js/site.js' | relative_url }}" defer></script>
{% if site.retire-service-worker %}<script src="{{ '/js/sw-retire.js' | relative_url }}" defer></script>{% endif %}

{% assign visits = site.data['visitor-stats'] %}
{% if visits.enabled or page.home_design == 'garden' %}
<script src="{{ '/js/visitor-stats.js' | relative_url }}" defer data-visits-enabled="{{ visits.enabled }}" data-visits-code="{{ visits.site_code | escape }}" data-visits-start="{{ visits.started_on | escape }}"></script>
{% endif %}
