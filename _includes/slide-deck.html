{% assign deck_slides = include.slides %}
{% if deck_slides and deck_slides.size > 0 %}
{% assign deck_title = include.title | default: page.title %}
<section class="slide-deck" data-slide-deck aria-label="{{ deck_title | escape }}">
  <div class="slide-deck__slides">
    {% for slide in deck_slides %}
    <figure class="slide-deck__slide" data-slide>
      <a class="slide-deck__image-link" href="{{ slide.image | relative_url }}" target="_blank" rel="noopener" aria-label="{{ forloop.index }}번 슬라이드 원본 이미지 열기">
        <img src="{{ slide.image | relative_url }}" alt="{{ slide.alt | escape }}" width="{{ slide.width }}" height="{{ slide.height }}" loading="lazy" decoding="async">
      </a>
      <figcaption>{{ slide.caption | escape }}</figcaption>
    </figure>
    {% endfor %}
  </div>
  <div class="slide-deck__toolbar" data-slide-controls hidden>
    <button type="button" data-slide-prev aria-label="이전 슬라이드">이전</button>
    <output class="slide-deck__count" data-slide-count>1 / {{ deck_slides.size }}</output>
    <button type="button" data-slide-next aria-label="다음 슬라이드">다음</button>
    <button type="button" data-slide-enlarge aria-label="현재 슬라이드 크게 보기">크게 보기</button>
  </div>
  <p class="slide-deck__status" data-slide-status role="status" aria-live="polite"></p>
  <dialog class="slide-deck__dialog" data-slide-dialog aria-label="{{ deck_title | escape }} 크게 보기">
    <button class="slide-deck__close" type="button" data-slide-close aria-label="확대 화면 닫기">닫기 ×</button>
    <img data-slide-dialog-image alt="">
    <p data-slide-dialog-caption></p>
  </dialog>
</section>
{% endif %}
