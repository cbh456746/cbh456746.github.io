name: Review project workbench

on:
  pull_request:
    paths:
      - '_data/workbench.json'
      - 'workbench/**'
      - 'js/workbench.js'
      - 'css/workbench.css'
      - 'scripts/*workbench*'
      - '.github/workflows/project-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/test-workbench.mjs
      - run: node scripts/workbench.mjs validate
      - name: Record exact-version project review
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/workbench.mjs review > workbench-review.json
          printf '## Project review\n\nSource: `%s`\n\n```json\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat workbench-review.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n\nThis checks state contracts, not subjective content or AI reasoning.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-review-${{ github.sha }}
          path: workbench-review.json
          retention-days: 14
