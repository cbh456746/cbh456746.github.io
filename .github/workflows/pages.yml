name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content rules
        run: npm run validate
      - name: Test durable project workflow
        run: npm run test:workbench
      - name: Test agent reference export contracts
        run: python3 -m unittest discover -s scripts -p 'test_context_export.py'
      - uses: actions/configure-pages@v5
      - name: Prepare isolated 1205-article Jekyll fixture
        run: python3 scripts/context-scale-fixture.py --prepare
      - name: Build isolated large article fixture
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_context_scale_source
          destination: ./_context_scale_site
      - name: Verify large rendered reference export
        run: |
          sudo chown -R -- "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/_context_scale_site/context"
          python3 scripts/context-scale-fixture.py --sha "$GITHUB_SHA"
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated RSS XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('_site/feed.xml').getroot()
          assert root.tag == 'rss' and root.find('channel') is not None, 'Expected RSS channel'
          print('Generated RSS XML is valid')
          PY
      - name: Validate generated sitemap
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          namespace = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          root = ET.parse('_site/sitemap.xml').getroot()
          assert root.tag == namespace + 'urlset', 'Expected sitemap URL set'
          urls = [node.text for node in root.iter(namespace + 'loc')]
          assert len(urls) == len(set(urls)), 'Duplicate sitemap URL'
          assert {'https://cbh456746.github.io/', 'https://cbh456746.github.io/projects/'} <= set(urls), 'Missing main pages'
          assert all(url.startswith('https://cbh456746.github.io/') for url in urls), 'Unexpected sitemap host'
          assert not any('/googlecbd5fbf8b460b385.html' in url or '/workbench/records/' in url for url in urls), 'Unexpected utility page'
          assert open('_site/robots.txt', encoding='utf-8').read().strip() == 'Sitemap: https://cbh456746.github.io/sitemap.xml'
          print(f'Generated sitemap is valid with {len(urls)} URLs')
          PY
      - name: Export reviewed article context
        run: |
          # The Jekyll container creates root-owned build outputs.
          sudo chown -R -- "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/_site/context"
          python3 scripts/export-context.py --site _site --sha "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
