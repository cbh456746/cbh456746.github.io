---
layout: default
---
{% assign profile = site.data.profile %}
<section class="resume-shell">
  <header class="resume-header">
    <h1>{{ profile.name | escape }}</h1>
  </header>
  <section><h2>Education</h2>
    {% for item in profile.education %}<p>{{ item.school | escape }}</p>{% endfor %}
  </section>
</section>
