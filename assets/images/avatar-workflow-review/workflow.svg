<svg xmlns="http://www.w3.org/2000/svg" width="800" height="880" viewBox="0 0 800 880" role="img" aria-labelledby="title desc"><title id="title">아바타 제작의 원화 관문과 동작 관문</title><desc id="desc">컨셉과 메인을 구분하고 필요한 소재를 만든 뒤 정면을 비교한다. 자연스러운 동작 품질과 실제 방송 검증은 각각 다음 관문이다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#677a72" stroke-width="1.5"/></marker></defs><rect width="800" height="880" rx="16" fill="#f1f5f1"/><g font-family="Malgun Gothic,Apple SD Gothic Neo,sans-serif" fill="#203a31"><text x="42" y="54" font-size="32" font-weight="700">원화 보존과 움직임은 각각 검수한다</text>
<rect x="42" y="90" width="716" height="96" rx="12" fill="#e0eee5" stroke="#80988b" /><text x="64" y="128" font-size="29" font-weight="700">1. 컨셉 아트</text><text x="96" y="163" font-size="25">캐릭터 정체성과 디자인의 기준</text><path d="M400 188V208" stroke="#677a72" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="210" width="716" height="96" rx="12" fill="#e0eee5" stroke="#80988b" /><text x="64" y="248" font-size="29" font-weight="700">2. 확정 메인 아트</text><text x="96" y="283" font-size="25">얼굴·비율·그림체·좌표를 고정</text><path d="M400 308V328" stroke="#677a72" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="330" width="716" height="96" rx="12" fill="#e0eee5" stroke="#80988b" /><text x="64" y="368" font-size="29" font-weight="700">3. 작업용 소재</text><text x="96" y="403" font-size="25">원본 추출 + 가려진 부위·새 표정</text><path d="M400 428V448" stroke="#677a72" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="450" width="716" height="96" rx="12" fill="#e0eee5" stroke="#80988b" /><text x="64" y="488" font-size="29" font-weight="700">4. 정면 외형 관문</text><text x="96" y="523" font-size="25">확정 메인과 같은 좌표에서 비교</text><path d="M400 548V568" stroke="#677a72" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="570" width="716" height="96" rx="12" fill="#fff0cc" stroke="#b77b17" stroke-dasharray="7 5"/><text x="64" y="608" font-size="29" font-weight="700">5. 동작 품질 관문 · 재검토</text><text x="96" y="643" font-size="25">방향별 형태·관절·지연·감쇠</text><path d="M400 668V688" stroke="#677a72" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="690" width="716" height="96" rx="12" fill="#edf0f0" stroke="#80988b" stroke-dasharray="7 5"/><text x="64" y="728" font-size="29" font-weight="700">6. 실제 추적·방송 관문</text><text x="96" y="763" font-size="25">같은 버전의 VTS·OBS로 확인</text><text x="42" y="841" font-size="23">정면 일치 · 파일 정상 · 화면 변화 ≠ 자연스러운 리깅</text></g></svg>
