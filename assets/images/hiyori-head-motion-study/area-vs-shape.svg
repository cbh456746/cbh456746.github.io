<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">Area preservation does not imply shape preservation</title><desc id="desc">A square of area one is mapped by a positive-determinant transformation to a wide thin rectangle of the same area. The directional scales are three and one third.</desc>
<rect width="1120" height="520" rx="16" fill="#fbfaf7"/><g font-family="Arial,sans-serif" fill="#1d1d1b"><text x="48" y="57" font-size="29" font-weight="700">Same area. Very different shape.</text><text x="48" y="91" font-size="19" fill="#676761">Positive determinant and no flipped triangles do not rule out distortion.</text>
<rect x="100" y="177" width="180" height="180" rx="1" fill="#cbded7" stroke="#3a6c5b" stroke-width="3"/><path d="M100 177 L280 357 M280 177 L100 357" stroke="#3a6c5b" stroke-width="2"/>
<path d="M365 267 H490 M470 249 L490 267 L470 285" fill="none" stroke="#676761" stroke-width="4"/>
<rect x="538" y="237" width="540" height="60" fill="#f0cbbf" stroke="#b84828" stroke-width="3"/><path d="M538 237 L1078 297 M1078 237 L538 297" stroke="#b84828" stroke-width="2"/>
<text x="110" y="405" font-size="23">Directional scales: 1, 1</text><text x="538" y="405" font-size="23">Directional scales: 3, 1/3</text><text x="110" y="441" font-size="21">Area ratio = 1</text><text x="538" y="441" font-size="21">Area ratio = 3 x 1/3 = 1</text>
<text x="48" y="491" font-size="17" fill="#676761">Conceptual example. These values are not measurements of the reference avatar.</text></g></svg>