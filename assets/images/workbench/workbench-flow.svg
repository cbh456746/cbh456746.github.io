<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">작업실 사용 흐름</title>
  <desc id="desc">프로젝트 선택, 작업과 근거 확인, 인수인계 및 개인 대화 파일 보관의 세 단계</desc>
  <rect width="1200" height="380" rx="24" fill="#f1eee7"/>
  <g font-family="Pretendard, Noto Sans KR, sans-serif" fill="#20231f">
    <rect x="32" y="42" width="344" height="282" rx="18" fill="#fff" stroke="#d9d8d0" stroke-width="2"/>
    <rect x="428" y="42" width="344" height="282" rx="18" fill="#fff" stroke="#d9d8d0" stroke-width="2"/>
    <rect x="824" y="42" width="344" height="282" rx="18" fill="#fff" stroke="#d9d8d0" stroke-width="2"/>
    <text x="60" y="86" font-size="20" font-weight="700" fill="#b84828">01 · 프로젝트</text>
    <text x="60" y="133" font-size="28" font-weight="700">목표를 고릅니다</text>
    <rect x="60" y="163" width="288" height="48" rx="9" fill="#f5f3ee" stroke="#deddd7"/>
    <text x="79" y="194" font-size="18">프로젝트 선택 ▾</text>
    <rect x="60" y="229" width="124" height="54" rx="9" fill="#e7efe5"/>
    <rect x="196" y="229" width="152" height="54" rx="9" fill="#f5f3ee"/>
    <text x="78" y="264" font-size="18">현재 상태</text>
    <text x="214" y="264" font-size="18">다음 작업</text>
    <text x="456" y="86" font-size="20" font-weight="700" fill="#b84828">02 · 확인</text>
    <text x="456" y="133" font-size="28" font-weight="700">작업을 읽습니다</text>
    <rect x="456" y="162" width="125" height="56" rx="9" fill="#f5f3ee" stroke="#deddd7"/>
    <rect x="593" y="162" width="151" height="56" rx="9" fill="#e7efe5"/>
    <text x="475" y="198" font-size="18">작업 보드</text>
    <text x="611" y="198" font-size="18">선행 흐름</text>
    <rect x="456" y="235" width="288" height="48" rx="9" fill="#f5f3ee"/>
    <text x="475" y="266" font-size="18">완료 기준 · 검증 근거</text>
    <text x="852" y="86" font-size="20" font-weight="700" fill="#b84828">03 · 이어가기</text>
    <text x="852" y="133" font-size="28" font-weight="700">기록을 전달합니다</text>
    <rect x="852" y="162" width="288" height="48" rx="9" fill="#20231f"/>
    <text x="871" y="193" font-size="18" fill="#fff">에이전트 인수인계 ↗</text>
    <rect x="852" y="228" width="288" height="55" rx="9" fill="#f5f3ee"/>
    <text x="871" y="262" font-size="17">개인 대화는 별도 JSON</text>
  </g>
  <path d="M382 183h39m-15-13 15 13-15 13M778 183h39m-15-13 15 13-15 13" fill="none" stroke="#b84828" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
