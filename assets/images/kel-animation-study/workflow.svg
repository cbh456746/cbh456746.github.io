<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" role="img" aria-labelledby="title desc">
<title id="title">플레이 영상에서 15.67초 동작 초안까지의 제작 흐름</title>
<desc id="desc">플레이 분석, 원화 여덟 장, 로컬 영상 생성 열네 번, 아홉 구간 편집, 결과 검수 순서다. 열네 번은 사전 시험 네 번을 제외한 본 제작 패스다.</desc>
<rect width="1120" height="230" fill="#f6f4ef"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64715e"/></marker></defs>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#263429">
<rect x="14" y="40" width="204" height="128" rx="6" fill="#ffffff" stroke="#d1d7cd"/><text x="116" y="77" font-size="14" fill="#6a7364">01</text><text x="116" y="111" font-size="19" font-weight="600">플레이 분석</text><text x="116" y="140" font-size="13">5.55초 · 166프레임</text><path d="M221 104h11" stroke="#64715e" marker-end="url(#arrow)"/><rect x="236" y="40" width="204" height="128" rx="6" fill="#ffffff" stroke="#d1d7cd"/><text x="338" y="77" font-size="14" fill="#6a7364">02</text><text x="338" y="111" font-size="19" font-weight="600">원화 제작</text><text x="338" y="140" font-size="13">8컷 · 야간 스타일</text><path d="M443 104h11" stroke="#64715e" marker-end="url(#arrow)"/><rect x="458" y="40" width="204" height="128" rx="6" fill="#ffffff" stroke="#d1d7cd"/><text x="560" y="77" font-size="14" fill="#6a7364">03</text><text x="560" y="111" font-size="19" font-weight="600">로컬 동작 생성</text><text x="560" y="140" font-size="13">14회 · 채택과 실패 분리</text><path d="M665 104h11" stroke="#64715e" marker-end="url(#arrow)"/><rect x="680" y="40" width="204" height="128" rx="6" fill="#ffffff" stroke="#d1d7cd"/><text x="782" y="77" font-size="14" fill="#6a7364">04</text><text x="782" y="111" font-size="19" font-weight="600">편집·효과·음향</text><text x="782" y="140" font-size="13">9구간 · 376프레임</text><path d="M887 104h11" stroke="#64715e" marker-end="url(#arrow)"/><rect x="902" y="40" width="204" height="128" rx="6" fill="#ffffff" stroke="#d1d7cd"/><text x="1004" y="77" font-size="14" fill="#6a7364">05</text><text x="1004" y="111" font-size="19" font-weight="600">결과 검수</text><text x="1004" y="140" font-size="13">15.67초 · 목표 미달</text></g><text x="560" y="206" font-family="system-ui,sans-serif" text-anchor="middle" font-size="14" fill="#64715e">원화 생성은 내장 도구, 이후 영상 생성은 사용자 GPU에서 실행했다.</text></svg>